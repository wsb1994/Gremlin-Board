name = "ps2_rx"
description = "PS/2 host decode. Skip start, sample 8 DATA bits on CLK fall, skip parity/stop/ACK."
protocol = "ps2"
direction = "decode"

[[steps]]
name = "wait_idle"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "wait_start_fall"
function = "wait_pin"
inputs = ["1", "0"]

[[steps]]
name = "wait_start_rise"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "count"
function = "set_x"
inputs = ["7"]

[[steps]]
name = "wait_fall"
function = "wait_pin"
inputs = ["1", "0"]

[[steps]]
name = "sample"
function = "in_lsb"
inputs = ["1"]

[[steps]]
name = "wait_rise"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "next"
function = "jmp_x_dec"
inputs = ["wait_fall"]

[[steps]]
name = "store"
function = "push"

[[steps]]
name = "skip_n"
function = "set_x"
inputs = ["2"]

[[steps]]
name = "skip_fall"
function = "wait_pin"
inputs = ["1", "0"]

[[steps]]
name = "skip_rise"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "skip_next"
function = "jmp_x_dec"
inputs = ["skip_fall"]

[[steps]]
name = "again"
function = "jmp"
inputs = ["wait_idle"]
