name = "spi_tx"
description = "Mode-0 encode with CS, MSB first. MOSI=pin0, SCK=pin1, CS=pin2 active-low."
protocol = "spi"
direction = "encode"

[[steps]]
name = "idle"
function = "set_pins"
inputs = ["4"]

[[steps]]
name = "drive"
function = "set_pindirs"
inputs = ["7"]

[[steps]]
name = "pull_byte"
function = "pull"

[[steps]]
name = "cs_lo"
function = "clr_bit"
inputs = ["2"]

[[steps]]
name = "count"
function = "set_x"
inputs = ["7"]

[[steps]]
name = "data"
function = "out_msb"
inputs = ["1"]

[[steps]]
name = "sck_hi"
function = "set_bit"
inputs = ["1"]

[[steps]]
name = "sck_lo"
function = "clr_bit"
inputs = ["1"]

[[steps]]
name = "next_bit"
function = "jmp_x_dec"
inputs = ["data"]

[[steps]]
name = "cs_hi"
function = "set_pins"
inputs = ["4"]

[[steps]]
name = "again"
function = "jmp"
inputs = ["pull_byte"]
