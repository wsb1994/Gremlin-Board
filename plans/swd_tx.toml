name = "swd_tx"
description = "SWDIO=pin0 SWCLK=pin1, LSB first."
protocol = "swd"
direction = "encode"

[[steps]]
name = "idle"
function = "set_pins"
inputs = ["0"]

[[steps]]
name = "drive"
function = "set_pindirs"
inputs = ["3"]

[[steps]]
name = "pull_byte"
function = "pull"

[[steps]]
name = "count"
function = "set_x"
inputs = ["7"]

[[steps]]
name = "data"
function = "out_lsb"
inputs = ["1"]

[[steps]]
name = "clk_hi"
function = "set_bit"
inputs = ["1"]

[[steps]]
name = "clk_lo"
function = "clr_bit"
inputs = ["1"]

[[steps]]
name = "next_bit"
function = "jmp_x_dec"
inputs = ["data"]

[[steps]]
name = "again"
function = "jmp"
inputs = ["pull_byte"]
