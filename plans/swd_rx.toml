name = "swd_rx"
description = "Skip 50 line-reset clocks then sample 8 LSB on SWCLK rise. Last 8 of 58 samples."
protocol = "swd"
direction = "decode"

[[steps]]
name = "skip_x"
function = "set_x"
inputs = ["28"]

[[steps]]
name = "skip_y"
function = "set_y"
inputs = ["28"]

[[steps]]
name = "wait_rise"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "sample"
function = "in_lsb"
inputs = ["1"]

[[steps]]
name = "next_x"
function = "jmp_x_dec"
inputs = ["wait_rise"]

[[steps]]
name = "wait_rise2"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "sample2"
function = "in_lsb"
inputs = ["1"]

[[steps]]
name = "next_y"
function = "jmp_y_dec"
inputs = ["wait_rise2"]

[[steps]]
name = "store"
function = "push"

[[steps]]
name = "again"
function = "jmp"
inputs = ["skip_x"]
