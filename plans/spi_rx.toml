name = "spi_rx"
description = "Mode-0 decode with CS. Wait CS low, sample MOSI on SCK rising, wait SCK fall, 8 MSB, wait CS high."
protocol = "spi"
direction = "decode"

[[steps]]
name = "wait_cs_lo"
function = "wait_pin"
inputs = ["2", "0"]

[[steps]]
name = "count"
function = "set_x"
inputs = ["7"]

[[steps]]
name = "wait_rise"
function = "wait_pin"
inputs = ["1", "1"]

[[steps]]
name = "sample"
function = "in_msb"
inputs = ["1"]

[[steps]]
name = "wait_fall"
function = "wait_pin"
inputs = ["1", "0"]

[[steps]]
name = "next_bit"
function = "jmp_x_dec"
inputs = ["wait_rise"]

[[steps]]
name = "store"
function = "push"

[[steps]]
name = "wait_cs_hi"
function = "wait_pin"
inputs = ["2", "1"]

[[steps]]
name = "again"
function = "jmp"
inputs = ["wait_cs_lo"]
