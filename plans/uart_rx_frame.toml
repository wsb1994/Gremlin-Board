name = "uart_rx_frame"
description = "8N1 decode with framing: start-bit verify (glitch reject), stop-bit check. Frame error flag on pin1; resyncs on idle."
protocol = "uart"
direction = "decode"

# pin0 = rx line (input), pin1 = frame-error flag (output, 1 = last frame bad)

[[steps]]
name = "flag_dir"
function = "set_pindirs"
inputs = ["2"]

[[steps]]
name = "wait_start"
function = "wait_pin"
inputs = ["0", "0"]

# Re-check the line 5 cycles into the 8-cycle start bit. Pulses shorter than
# that are glitches, not start bits.
[[steps]]
name = "verify"
function = "delay"
delay = 3

[[steps]]
name = "chk_start"
function = "jmp_pin"
inputs = ["wait_start"]

# First data sample lands at cycle 12 = centre of bit 0.
[[steps]]
name = "to_first"
function = "delay"
delay = 4

[[steps]]
name = "count"
function = "set_x"
inputs = ["7"]

[[steps]]
name = "sample"
function = "in_lsb"
inputs = ["1"]
delay = 6

[[steps]]
name = "next_bit"
function = "jmp_x_dec"
inputs = ["sample"]

# Stop bit sampled at cycle 76 = its centre. High = good frame.
[[steps]]
name = "stop_ok"
function = "jmp_pin"
inputs = ["store"]

[[steps]]
name = "flag"
function = "set_bit"
inputs = ["1"]

[[steps]]
name = "resync"
function = "wait_pin"
inputs = ["0", "1"]

[[steps]]
name = "back"
function = "jmp"
inputs = ["wait_start"]

[[steps]]
name = "store"
function = "push"

[[steps]]
name = "clear"
function = "clr_bit"
inputs = ["1"]

[[steps]]
name = "again"
function = "jmp"
inputs = ["wait_start"]
