name = "spi_rx_p345"
description = "Mode-0 decode MOSI=pin3 SCK=pin4 CS=pin5."
protocol = "spi"
direction = "decode"

[[steps]]
name = "wait_cs_lo"
function = "wait_pin"
inputs = ["5", "0"]

[[steps]]
name = "mosi"
function = "set_inpin"
inputs = ["3"]

[[steps]]
name = "count"
function = "set_x"
inputs = ["7"]

[[steps]]
name = "wait_rise"
function = "wait_pin"
inputs = ["4", "1"]

[[steps]]
name = "sample"
function = "in_msb"
inputs = ["1"]

[[steps]]
name = "wait_fall"
function = "wait_pin"
inputs = ["4", "0"]

[[steps]]
name = "next_bit"
function = "jmp_x_dec"
inputs = ["wait_rise"]

[[steps]]
name = "store"
function = "push"

[[steps]]
name = "wait_cs_hi"
function = "wait_pin"
inputs = ["5", "1"]

[[steps]]
name = "again"
function = "jmp"
inputs = ["wait_cs_lo"]
