[project]
name = "loom"
version = "0.2.0"
description = "Agent-programmable pin/time graph engine for Tiny Tapeout CMOS5L"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["amaranth>=0.5,<0.6", "amaranth-yosys"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loom = "loom.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["generator", "tests"]
addopts = "-q"
filterwarnings = [
    "ignore:UnusedElaboratable",
    "ignore:`reset=` is deprecated",
]
