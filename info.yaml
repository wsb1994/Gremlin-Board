# Tiny Tapeout project information
project:
  title:        "loom graph engine"
  author:       "wsb"
  discord:      ""
  description:  "Reprogrammable pin/time graph engine. Protocols are loaded graphs."
  language:     "Amaranth"
  clock_hz:     50000000

  # Jane Street protocol-emulator contest: 6x4 Tiny Tapeout tiles on CMOS5L (8x4 is not a valid CMOS5L tile size).
  tiles: "6x4"

  top_module:  "tt_um_loom_gpe"

  source_files:
    - "loom_engine.v"
    - "project.v"

pinout:
  ui[0]: "run"
  ui[1]: "imem_we"
  ui[2]: "imem_addr[0]"
  ui[3]: "imem_addr[1]"
  ui[4]: "imem_addr[2]"
  ui[5]: "imem_addr[3]"
  ui[6]: "imem_addr[4]"
  ui[7]: "tx_push"
  uo[0]: "run"
  uo[1]: "tx_full"
  uo[2]: "rx_empty"
  uo[3]: "pc[0]"
  uo[4]: "pc[1]"
  uo[5]: "pc[2]"
  uo[6]: "pc[3]"
  uo[7]: "pc[4]"
  uio[0]: "gpio0"
  uio[1]: "gpio1"
  uio[2]: "gpio2"
  uio[3]: "gpio3"
  uio[4]: "gpio4"
  uio[5]: "gpio5"
  uio[6]: "gpio6"
  uio[7]: "gpio7"

yaml_version: 6
