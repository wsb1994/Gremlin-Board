name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  power_grid:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: checkout tt-support-tools (pin template DEF)
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: download hardened GDS
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: tt_submission

      - name: SRAM + stdcell supply connectivity (KLayout net extraction)
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ghcr.io/librelane/librelane:3.1.0.dev3 \
            klayout -b -r scripts/check_pg_klayout.py \
              -rd gds=tt_submission/tt_submission/tt_um_loom_gpe.gds \
              -rd lef=src/macros/RM_IHPSG13_2P_256x16_c2_bm_bist.lef | tee power_grid.txt
          grep -q '^PASS' power_grid.txt

      - name: Every TT pin present, unshorted, wired to logic (KLayout net extraction)
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ghcr.io/librelane/librelane:3.1.0.dev3 \
            klayout -b -r scripts/check_pins_klayout.py \
              -rd gds=tt_submission/tt_submission/tt_um_loom_gpe.gds \
              -rd template=tt/tech/ihp-sg13cmos5l/def/tt_block_6x4_pgvdd.def | tee pins.txt
          grep -q '^PASS' pins.txt

      - name: summary
        if: always()
        run: cat power_grid.txt pins.txt >> $GITHUB_STEP_SUMMARY

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
